name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test without permissions
        run: swift test
      - name: Check shell syntax
        run: bash -n restart.sh uninstall.sh
